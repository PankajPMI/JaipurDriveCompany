<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Jaipur Drive Company</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

/* Main Card */
.contact-container{
  width:100%;
  max-width:900px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:50px 30px;
  text-align:center;
  box-shadow:0 0 60px rgba(255,215,0,0.2);
  position:relative;
  overflow:hidden;
}

/* ===== GOLDEN LOGO SECTION ===== */

.logo-wrapper{
  display:flex;
  justify-content:center;
  margin-bottom:30px;
  position:relative;
}

.logo-circle{
  width:230px;
  height:230px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  overflow:hidden;
}

/* Rotating Golden Border */
.logo-circle::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  background:conic-gradient(
    #d4af37,
    #ffd700,
    #fff3b0,
    #d4af37
  );
  border-radius:50%;
  animation:rotate 6s linear infinite;
  z-index:0;
}

.logo-circle::after{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  background:#111;
  border-radius:50%;
  z-index:1;
}

.logo-circle img{
  width:150px;
  z-index:2;
  position:relative;
}

/* Shine Effect */
.shine{
  position:absolute;
  top:0;
  left:-75%;
  width:50%;
  height:100%;
  background:linear-gradient(
    120deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.6) 50%,
    rgba(255,255,255,0) 100%
  );
  transform:skewX(-20deg);
  animation:shineMove 4s infinite;
  z-index:3;
}

@keyframes shineMove{
  0%{left:-75%;}
  100%{left:130%;}
}

@keyframes rotate{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* Heading */
h1{
  margin-top:25px;
  font-size:28px;
  font-weight:600;
  color:#ffd700;
}

.contact-number{
  margin-top:10px;
  font-size:20px;
  font-weight:500;
}

/* Contact Form */
form{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

input,textarea{
  padding:12px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:white;
  outline:none;
}

button{
  padding:12px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#d4af37,#ffd700);
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

/* Moving Car */
.car{
  position:absolute;
  bottom:20px;
  left:-200px;
  font-size:40px;
  animation:carMove 12s linear infinite;
}

@keyframes carMove{
  0%{left:-200px;}
  100%{left:110%;}
}

/* Map */
.map{
  margin-top:30px;
  border-radius:15px;
  overflow:hidden;
}
iframe{
  width:100%;
  height:250px;
  border:0;
}
</style>
</head>
